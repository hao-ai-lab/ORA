schema: ora.native-provider-catalog.v1
default_profile: deepseek_flash_openai_low_16k_v1
profiles:
  deepseek_flash_openai_high_v1:
    protocol: openai_compatible
    endpoint: https://api.deepseek.com
    model: deepseek-flash
    model_env: DEEPSEEK_MODEL_ID
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    proxy_env: []
    reasoning_effort: high
    context_window_tokens: 1048576
    max_output_tokens: 32768
    stream: true
    supports_images: true
    qualification_schema: ora.native-provider-probe.v1
    qualification_version: 1
    auth_scheme: bearer
    endpoint_transport: https_v1
    admission: vision_qualified
    usage_scope: general_api
    source_url: https://api-docs.deepseek.com/guides/vision/
  # Same endpoint, model and admission as deepseek_flash_openai_high_v1; the
  # output budget is halved. Measured across 1,836 responses of one batch: the
  # median answer is 2,168 tokens and p90 is 9,027, so 32,768 was never reached
  # by anything but the two longest deliberations, while 96 percent of every
  # answer was reasoning. 16,384 truncates 2.5 percent of responses where 8,192
  # would truncate 11.7 percent -- and a truncated answer is a lost turn, not a
  # shorter one. Its own profile rather than an edit to the shared entry,
  # because three other packages bind that one.
  deepseek_flash_openai_high_16k_v1:
    protocol: openai_compatible
    endpoint: https://api.deepseek.com
    model: deepseek-flash
    model_env: DEEPSEEK_MODEL_ID
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    proxy_env: []
    reasoning_effort: high
    context_window_tokens: 1048576
    max_output_tokens: 16384
    stream: true
    supports_images: true
    qualification_schema: ora.native-provider-probe.v1
    qualification_version: 1
    auth_scheme: bearer
    endpoint_transport: https_v1
    admission: vision_qualified
    usage_scope: general_api
    source_url: https://api-docs.deepseek.com/guides/vision/
  # Default for new experiments; exact consumed Low 16K provider registration.
  deepseek_flash_openai_low_16k_v1:
    protocol: openai_compatible
    endpoint: https://api.deepseek.com
    model: deepseek-flash
    model_env: DEEPSEEK_MODEL_ID
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_LOW_API_KEY
    proxy_env: []
    reasoning_effort: low
    context_window_tokens: 1048576
    max_output_tokens: 16384
    stream: true
    supports_images: true
    qualification_schema: ora.native-provider-probe.v1
    qualification_version: 1
    auth_scheme: bearer
    endpoint_transport: https_v1
    admission: vision_qualified
    usage_scope: general_api
    source_url: https://api-docs.deepseek.com/guides/vision/
  volcengine_agent_plan_glm_5_2_anthropic_v1:
    protocol: anthropic_messages
    endpoint: https://ark.cn-beijing.volces.com/api/plan
    model: glm-5.2
    model_env: VOLCENGINE_AGENT_PLAN_MODEL_ID
    base_url_env: VOLCENGINE_AGENT_PLAN_BASE_URL
    api_key_env: VOLCENGINE_AGENT_PLAN_API_KEY
    proxy_env: [HTTPS_PROXY, https_proxy]
    reasoning_effort: provider_default
    context_window_tokens: 1048576
    max_output_tokens: 131072
    stream: true
    supports_images: false
    qualification_schema: ora.native-provider-probe.v1
    qualification_version: 1
    auth_scheme: bearer
    admission: text_tool_qualified
    usage_scope: agent_plan_api
    source_url: https://www.volcengine.com/docs/82379/2373746?lang=zh
  # ---------------------------------------------------------------------------
  # Strong-model and loopback-gateway profiles (integration 0062 unit U11, user
  # decision 2026-10-04). Copied byte for byte, comments included, from the
  # catalogs where EXP11A/EXP11B and EXP08H registered them: the three below from
  # experiments/exp11a_robodojo/provider-profiles.yaml (frozen launcher) and the
  # Kimi K3 account pool from experiments/exp08h_placement_bundle/
  # backlog-provider-profiles.yaml. Ids and values are unchanged, so recorded
  # RunPlans that name them still match; the credentials stay where the
  # profiles' *_env variables and the loopback gateways' client files put them.
  # ---------------------------------------------------------------------------
  # EXP11A g009 (user decision 2026-10-01): DeepSeek Flash at the High
  # reasoning tier. The built-in high profiles bind DEEPSEEK_API_KEY, which
  # returned HTTP 401 on 2026-09-16; the reasoning tier is a request parameter,
  # not a credential property, so this profile reaches High through the
  # account the Low profile uses (the user's key installed 2026-10-01). It is
  # the EXP10A sharedkey profile (experiments/exp10a_dshigh_random_tier4_k1)
  # unchanged; the name records the shared credential.
  deepseek_flash_openai_high_16k_sharedkey_v1:
    protocol: openai_compatible
    endpoint: https://api.deepseek.com
    model: deepseek-flash
    model_env: DEEPSEEK_MODEL_ID
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_LOW_API_KEY
    proxy_env: []
    reasoning_effort: high
    context_window_tokens: 1048576
    max_output_tokens: 16384
    stream: true
    supports_images: true
    qualification_schema: ora.native-provider-probe.v1
    qualification_version: 1
    auth_scheme: bearer
    endpoint_transport: https_v1
    admission: vision_qualified
    usage_scope: general_api
    source_url: https://api-docs.deepseek.com/guides/vision/
  # EXP11A g015 (user decision 2026-10-02): GPT-6 Astra through the user's
  # ChatGPT Pro subscription, served by a local CLIProxyAPI instance (client
  # binding in ~/.config/cliproxyapi-codex; run.py loads it). The proxy speaks
  # OpenAI-compatible Chat Completions on /v1, so the endpoint carries /v1 and
  # the base-URL variable is set from the profile, not from the client file.
  # GPT-6 names its output budget max_completion_tokens. The 262,144-token
  # window is the user's default for OpenAI models through the subscription
  # (the public model window is larger); it sets the lossless-v4 thresholds.
  # The Codex backend reuses its prompt cache only with X-Session-ID
  # (2026-10-02: 0 cached tokens without it, ~97% from the second request with
  # it), hence the loopback session affinity. EXP11B (2026-10-03): the
  # gateway's Responses backend decodes a function tool without "strict" as
  # strict when the schema allows it, so GPT-6 filled every optional key
  # (EXP11A g016: 535/535 geometry_query calls refused); a probe with
  # "strict": false sent only the arguments it meant. tool_strictness states it
  # on every function tool of the wire (agent/providers/openai_wire_options.py).
  gpt6_astra_codexproxy_openai_high_16k_v1:
    protocol: openai_compatible
    endpoint: http://127.0.0.1:8319/v1
    endpoint_transport: loopback_http_v1
    gateway_client_binding: true
    model: gpt-6-astra
    model_env: CODEX_PROXY_MODEL_ID
    base_url_env: CODEX_PROXY_CHAT_BASE_URL
    api_key_env: CODEX_PROXY_API_KEY
    proxy_env:
    - NO_PROXY
    - no_proxy
    reasoning_effort: high
    context_window_tokens: 262144
    max_output_tokens: 16384
    output_token_parameter: max_completion_tokens
    tool_strictness: explicit_false
    stream: true
    supports_images: true
    session_affinity: x_session_id_run_v1
    auth_scheme: bearer
    qualification_schema: ora.native-provider-probe.v1
    qualification_version: 1
  # EXP11B g005 (user decision 2026-10-02: "跑完所有之后把成功的实验再拍一个 sol
  # 6.1 的版本看看区别", rerun the successful cells as a GPT-6.1 Sol version once
  # everything has finished): GPT-6.1 Sol through the same Codex gateway. The
  # Astra profile with only the model changed. Operator probe on 2026-10-02:
  # the gateway serves gpt-6.1-sol, accepts reasoning_effort high, reuses its
  # prompt cache with X-Session-ID and, with "strict": false, sends only the
  # arguments it means. CODEX_PROXY_MODEL_ID is not read from the caller's
  # environment: run.py sets it to this profile's model, and the Native client
  # sends the RunPlan's policy.model.
  gpt61_sol_codexproxy_openai_high_16k_v1:
    protocol: openai_compatible
    endpoint: http://127.0.0.1:8319/v1
    endpoint_transport: loopback_http_v1
    gateway_client_binding: true
    model: gpt-6.1-sol
    model_env: CODEX_PROXY_MODEL_ID
    base_url_env: CODEX_PROXY_CHAT_BASE_URL
    api_key_env: CODEX_PROXY_API_KEY
    proxy_env:
    - NO_PROXY
    - no_proxy
    reasoning_effort: high
    context_window_tokens: 262144
    max_output_tokens: 16384
    output_token_parameter: max_completion_tokens
    tool_strictness: explicit_false
    stream: true
    supports_images: true
    session_affinity: x_session_id_run_v1
    auth_scheme: bearer
    qualification_schema: ora.native-provider-probe.v1
    qualification_version: 1
  # Kimi K3 through a local loopback account pool, per-run session affinity.
  kimi_loopback_pool_k3_anthropic_high_v1:
    protocol: anthropic_messages
    endpoint: http://127.0.0.1:8318
    endpoint_transport: loopback_http_v1
    gateway_client_binding: true
    model: k3
    model_env: NATIVE_MODEL_ID
    base_url_env: NATIVE_MODEL_BASE_URL
    api_key_env: NATIVE_MODEL_API_KEY
    proxy_env:
    - NO_PROXY
    - no_proxy
    reasoning_effort: high
    context_window_tokens: 262144
    max_output_tokens: 8192
    stream: true
    supports_images: true
    qualification_schema: ora.native-provider-probe.v1
    qualification_version: 1
    session_affinity: x_session_id_run_v1
