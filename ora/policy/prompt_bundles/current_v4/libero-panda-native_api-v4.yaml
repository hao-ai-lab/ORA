schema: ora.prompt-bundle-authoring.v1
bundle_id: direct_v4_libero_native_api_v1
status: draft
runtime:
  policy_kind: native_api
  context_schema: ora.policy-context.v3
  provider_scaffold: none
layers:
  planner:
    sources:
    - ora/policy/planners/native/policy-v5.md
    delivery: system
  core:
    sources:
    - ora/policy/core/evidence-action-loop-v8.md
    delivery: project_instructions
  environment:
    source: ora/policy/environments/libero_pro/boundary-v2.md
    delivery: project_instructions
  embodiment:
    source: ora/policy/embodiments/franka-panda/manual-public-geometry-v3.md
    format: prompt_bundle_embodiment_v1
    descriptor: ora/policy/embodiments/franka-panda/descriptor-public-geometry-direct-v1-controller-feedback-v1-session-split-v1.json
    control_profile: ora/policy/embodiments/franka-panda/motion-profile-v2.json
    delivery: project_instructions
  episode_task:
    source: ora/policy/prompt_bundles/templates/episode-task-v2.md
    placeholder: '{{TASK}}'
    delivery: first_user_message
  tool_manual:
    sources:
    - ora/policy/prompt_bundles/templates/tool-schema-delivery-v1.md
    delivery: manifest_only
    reader_tool: null
  tool_surface:
    profile: libero_placement_direct_overhead_v1
    delivery: provider_tools_field
  dynamic_runtime:
    owner: ora
    delivery: current_user_tail
bindings:
  environment_prompt_profile:
    profile_id: libero_pro_public_direct_v1
    public_environment_context:
      schema: ora.public-environment-context.v1
      environment_id: libero_pro
      embodiment_id: franka_panda
      robot_models:
      - Panda
      controller: CUROBO_JOINT_POSITION+OSC_POSE
      public_cameras:
      - agentview
      - wrist
ownership:
  environment_terms:
  - LIBERO
  - LIBERO-Pro
  embodiment_terms:
  - Franka
  - Panda
