schema: ora.prompt-bundle-authoring.v1
bundle_id: direct_v4_robotwin_native_api_v1
status: draft
runtime:
  policy_kind: native_api
  context_schema: ora.policy-context.v3
  provider_scaffold: none
layers:
  planner:
    sources:
    - ora/policy/planners/native/policy-v5.md
    delivery: system
  core:
    sources:
    - ora/policy/core/evidence-action-loop-v8.md
    delivery: project_instructions
  environment:
    source: ora/policy/environments/robotwin/boundary-v4.md
    delivery: project_instructions
  embodiment:
    source: ora/policy/embodiments/aloha-agilex/manual-public-geometry-v3.md
    format: prompt_bundle_embodiment_v1
    descriptor: ora/policy/embodiments/aloha-agilex/descriptor-public-geometry-v5-session-split-v1.json
    control_profile: ora/policy/embodiments/aloha-agilex/control-profile-v10.json
    delivery: project_instructions
  episode_task:
    source: ora/policy/prompt_bundles/templates/episode-task-v2.md
    placeholder: '{{TASK}}'
    delivery: first_user_message
  tool_manual:
    sources:
    - ora/policy/prompt_bundles/templates/tool-schema-delivery-v1.md
    delivery: manifest_only
    reader_tool: null
  tool_surface:
    profile: robotwin_toolchain_b2_closed_noservo_v2
    delivery: provider_tools_field
  dynamic_runtime:
    owner: ora
    delivery: current_user_tail
bindings:
  environment_prompt_profile:
    profile_id: robotwin_public_explicit_v6
    public_environment_context:
      schema: ora.public-environment-context.v1
      environment_id: robotwin
      embodiment_id: aloha_agilex
      robot_models:
      - ALOHA-AgileX
      controller: motion_action_v3
      public_cameras:
      - head_camera
      - front_camera
      - left_camera
      - right_camera
ownership:
  environment_terms:
  - RoboTwin
  embodiment_terms:
  - ALOHA
  - ALOHA-AgileX
  - AgileX
