schema: ora.prompt-bundle-authoring.v1
bundle_id: local_cpu_libero_native_api_v1
status: draft
runtime:
  policy_kind: native_api
  context_schema: ora.policy-context.v3
  provider_scaffold: none
layers:
  planner:
    sources:
    - ora/policy/planners/native/policy-v3.md
    delivery: system
  core:
    sources:
    - ora/policy/core/evidence-action-loop-v2.md
    delivery: project_instructions
  environment:
    source: ora/policy/environments/libero_pro/boundary-v2.md
    delivery: project_instructions
  embodiment:
    source: ora/policy/embodiments/franka-panda/manual-local-cpu-v1.md
    format: prompt_bundle_embodiment_v1
    descriptor: null
    control_profile: ora/policy/embodiments/franka-panda/control-local-cpu-v1.json
    delivery: project_instructions
  episode_task:
    source: ora/policy/prompt_bundles/templates/episode-task-v2.md
    placeholder: '{{TASK}}'
    delivery: first_user_message
  tool_manual:
    sources:
    - ora/policy/prompt_bundles/templates/tool-schema-delivery-v1.md
    delivery: manifest_only
    reader_tool: null
  tool_surface:
    profile: local_atomic_cpu_v1
    delivery: provider_tools_field
  dynamic_runtime:
    owner: ora
    delivery: current_user_tail
bindings:
  environment_prompt_profile:
    profile_id: libero_pro_local_cpu_v1
    public_environment_context:
      schema: ora.public-environment-context.v1
      environment_id: libero_pro
      embodiment_id: franka_panda
      robot_models: [Panda]
      controller: OSC_POSE
      public_cameras: [agentview, wrist]
ownership:
  environment_terms: [LIBERO, LIBERO-Pro]
  embodiment_terms: [Franka, Panda]
