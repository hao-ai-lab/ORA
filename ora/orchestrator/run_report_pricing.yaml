# API-equivalent token prices for the run report (orchestrator/run_report.py).
#
# A price here is what a direct API customer would pay per million tokens. It
# is not necessarily what a run cost (a run may reach a model through another
# billing arrangement), so every figure computed from this table is labelled
# "API-equivalent". Keys are the model names the PolicySession reports
# (`session_started` payload `model`, else the plan's `policy.model`).
#
# cost = (input - cached_input) * input + cached_input * cached_input
#        + output * output                     (all per 1,000,000 tokens)
#
# `output` covers reasoning tokens: providers report them inside output_tokens.
# Anthropic cache-creation tokens are priced as uncached input.
#
# A model without an entry is reported unpriced (cost null), never estimated.
# No provider profile in ora/agent/providers/builtin-profiles.yaml
# carries a price; add a model here to price it.
schema: ora.api-pricing.v1
label: api_equivalent
currency: USD
unit: per_million_tokens
models:
  gpt-6-astra:
    input: 10.0
    cached_input: 1.0
    output: 50.0
    source: list price, 2026-10-04
  gpt-6.1-sol:
    input: 2.0
    cached_input: 0.1
    output: 10.0
    source: list price, 2026-10-04
