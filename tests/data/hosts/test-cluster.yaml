# Test fixture execution host profile (test-cluster); not a real host. Tests load it
# through ORA_HOSTS_DIR (tests/conftest.py).
schema: ora.execution-host.v1
id: test-cluster
ssh_alias: null
execution_marker:
  environment_variable: ORA_EXECUTION_HOST
  required_value: test-cluster
project_root:
  environment_variable: ORA_PROJECT_ROOT
robotwin_root:
  environment_variable: ROBOTWIN_ROOT
robotwin_python:
  environment_variable: ROBOTWIN_PYTHON
  purpose: Isolated RoboTwin worker interpreter with SAPIEN, Torch and CuRobo.
libero_pro:
  python:
    environment_variable: LIBERO_PRO_PYTHON
    purpose: Isolated LIBERO-Pro worker interpreter with Torch, MuJoCo and robosuite.
  simulator_root:
    environment_variable: LIBERO_PRO_ROOT
    purpose: Exact clean LIBERO-Pro simulator source and asset root.
  dataset_root:
    environment_variable: LIBERO_PRO_DATA_ROOT
    purpose: Exact clean authoritative BDDL and init-state dataset snapshot.
motion_planner:
  python:
    environment_variable: CUROBO_PYTHON
    purpose: CuRobo interpreter matching the pinned revision.
  root:
    environment_variable: CUROBO_ROOT
    purpose: Exact clean CuRobo checkout matching the pinned revision.
credentials:
  mode: trusted_environment_only
  committed_values: forbidden
